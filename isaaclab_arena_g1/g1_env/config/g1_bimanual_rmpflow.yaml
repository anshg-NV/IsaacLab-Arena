format: rmpflow
api_version: 2.0

# 14 DOF: left arm (7) + right arm (7). Waist joints excluded.
# +-5 deg (~0.0873 rad) buffer from nominal joint limits.
joint_limit_buffers: [.0873, .0873, .0873, .0873, .0873, .0873, .0873,
                      .0873, .0873, .0873, .0873, .0873, .0873, .0873]

rmp_params:
  cspace_target_rmp:
    metric_scalar: 0.8
    position_gain: 100.
    damping_gain: 70.
    robust_position_term_thresh: .5
    inertia: 0.01
  cspace_trajectory_rmp:
    p_gain: 80.
    d_gain: 10.
    ff_gain: .25
    weight: 0.5
  cspace_affine_rmp:
    final_handover_time_std_dev: .25
    weight: 20.
  joint_limit_rmp:
    metric_scalar: 5.
    metric_length_scale: .05
    metric_exploder_eps: 1e-3
    metric_velocity_gate_length_scale: .05
    accel_damper_gain: 100.
    accel_potential_gain: 1.
    accel_potential_exploder_length_scale: .2
    accel_potential_exploder_eps: 1e-2
  joint_velocity_cap_rmp:
    max_velocity: 2.15
    velocity_damping_region: 0.5
    damping_gain: 300.
    metric_weight: 1.
  target_rmp:
    accel_p_gain: 110.
    accel_d_gain: 30.
    accel_norm_eps: .1 # 0.075 m/s^2 Must be positive.
    metric_alpha_length_scale: .05
    min_metric_alpha: .01
    max_metric_scalar: 100.
    min_metric_scalar: 25.
    proximity_metric_boost_scalar: 1.5
    proximity_metric_boost_length_scale: .02
    accept_user_weights: false
  axis_target_rmp:
    accel_p_gain: 60.
    accel_d_gain: 12.
    metric_scalar: 6.
    proximity_metric_boost_scalar: 10.
    proximity_metric_boost_length_scale: .05
    accept_user_weights: false
  collision_rmp:
    damping_gain: 50.
    damping_std_dev: .04
    damping_robustness_eps: 1e-2
    damping_velocity_gate_length_scale: .05
    repulsion_gain: 1000.
    repulsion_std_dev: .01
    metric_modulation_radius: .5
    metric_scalar: 5.
    metric_exploder_std_dev: .02
    metric_exploder_eps: .001
  damping_rmp:
    accel_d_gain: 32.
    metric_scalar: 0.65
    inertia: 150.

canonical_resolve:
  max_acceleration_norm: 40.
  projection_tolerance: .01
  verbose: false

body_capsules:
  - name: pelvis
    pt1: [0, 0, -0.105]
    pt2: [0, 0, 0.195]
    radius: .125

body_collision_controllers:
  - name: left_shoulder_yaw_link
    radius: .038
  - name: left_elbow_link
    radius: .045
  - name: left_wrist_roll_link
    radius: .04
  - name: left_wrist_pitch_link
    radius: .04
  - name: left_wrist_yaw_link
    radius: .04
  - name: right_shoulder_yaw_link
    radius: .038
  - name: right_elbow_link
    radius: .045
  - name: right_wrist_roll_link
    radius: .04
  - name: right_wrist_pitch_link
    radius: .04
  - name: right_wrist_yaw_link
    radius: .04
